version: '3.4'

services:

  redisdb:
    image: redis:alpine

  posgresdb:
    image: postgres

  pgadmin:
    image: dpage/pgadmin4  

  portainer:
    image: portainer/portainer-ce

  seq:
    image: datalust/seq:latest

  reverseproxy:
    image: reverseproxy
    container_name: reverseproxy
    build:
      context: ./Nginx
      dockerfile: Nginx.Dockerfile
    restart: always

  #reverseproxy:
  # container_name: reverseproxy
  # image : nginx
  # build:
  #    context: ./Nginx
  #    dockerfile: Nginx.Dockerfile
  # environment:
  #  - NGINX_HOST=localhost
  #  - NGINX_PORT=80

  v2rayapi:
    image:  ${DOCKER_REGISTRY-}v2rayapi
    restart: always
    depends_on:
       - reverseproxy
    build:
      context: .
      dockerfile: V2Ray.Api/Dockerfile


volumes:
  portainer_data:
  postgres_data:
  pgadmin_data:


