version: '3.4'

services:

  #redisdb:
  #  image: redis:alpine

  posgresdb:
    image: postgres

  #pgadmin:
  #  image: dpage/pgadmin4  

  #portainer:
  #  image: portainer/portainer-ce

  #seq:
  #  image: datalust/seq:latest

  nginx:
    image: nginx:alpine
    restart: always

  reverseproxy:
   container_name: reverseproxy
   image : nginx
   environment:
    - NGINX_HOST=localhost
    - NGINX_PORT=80

  v2rayapi:
    image:  ${DOCKER_REGISTRY-}v2rayapi
    restart: always
    depends_on:
       - posgresdb
       - nginx
    build:
      context: .
      dockerfile: V2Ray.Api/Dockerfile


volumes:
  postgres_data:

