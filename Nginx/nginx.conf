
worker_processes 1;

events { worker_connections 1024; }

http {

    sendfile on;

    upstream v2rayapi {
        server v2rayapi:5000; # the name of the docker container
    }
     server {
        listen 80;
        server_name  iranv2ray.com;

        location /.well-known/acme-challenge/ {
        root /var/www/certbot;
         }
       
         if ($http_x_forwarded_proto = "http") {
             return 301 https://iranv2ray.com$request_uri;
            }
    }

server {
        listen 443 default_server ssl http2;
        listen [::]:443 ssl http2;

        server_name   iranv2ray.com; 

        error_log /var/log/nginx/dom_error.log;
        access_log /var/log/nginx/dom_access.log;


        ssl_certificate /etc/letsencrypt/live/iranv2ray.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/iranv2ray.com/privkey.pem;

        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            proxy_pass         http://v2rayapi;
            proxy_redirect     off;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host $server_name;
        }
    }

}
