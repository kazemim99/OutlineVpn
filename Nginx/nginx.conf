
worker_processes 1;

events { worker_connections 1024; }

http {

    sendfile on;

    upstream v2rayapi {
        server v2rayapi:5000; # the name of the docker container
    }

  server {
    listen 80;
    listen [::]:80;

    server_name iranv2ray.com www.iranv2ray.com;
    server_tokens off;
    

    location / {
        return 301 https://iranv2ray.com$request_uri;
    }
}



server {
    listen 443 default_server ssl http2;
    listen [::]:443 ssl http2;

    server_name iranv2ray.com www.iranv2ray.com; 
    ssl_certificate cert.cert;
    ssl_certificate_key privkey.key;
    ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://v2rayapi;
            proxy_redirect     off;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host $server_name;
        }
        location /seq
        {
          proxy_pass         http://seq;
        }
    }
}
