version: '3.4'

services:

  redisdb:
    container_name: redisdb
    restart: always    
    ports:
        - "6379:6379"

  seq:
    container_name: seq
    hostname: seq
    restart: always   
    environment:
      - ACCEPT_EULA=Y   
    ports:
      - "5341:80"
    volumes:
      - /datadrive:/data

  posgresdb:
    container_name: posgresdb
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=!Q@W#E
      - POSTGRES_DB=V2Ray
    restart: always
    ports:
        - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/


  pgadmin:
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=iranv2ray@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=!Q@W#E
    restart: always
    ports:
        - "5050:80"
    volumes:
      - pgadmin_data:/root/.pgadmin

  portainer:
    container_name: portainer
    restart: always
    ports:
      - "8080:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data


  reverseproxy:
    ports:
       - 80:80
       - 443:433
    restart: always
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    container_name: cerbot
    image: certbot/certbot:latest
    volumes:
       - ./data/certbot/conf:/etc/letsencrypt
       - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"



  v2rayapi:
    expose:
      - "5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionString:Default=Server=posgresdb;Port=5432;Database=V2Ray;User Id=admin;Password=!Q@W#E;
    depends_on:
      - posgresdb
      - reverseproxy
    volumes:
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    restart: always
  
  

  #nginx:
  ## ports:
  ##    - "80:80"



