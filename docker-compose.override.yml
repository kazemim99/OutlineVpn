version: '3.4'

services:

  redisdb:
    container_name: redisdb
    restart: always    
    ports:
        - "6379:6379"

  seq:
    container_name: seq
    hostname: seq
    restart: always   
    environment:
      - ACCEPT_EULA=Y   
    ports:
      - "5341:5341"
    volumes:
      - /datadrive:/data

  posgresdb:
    container_name: posgresdb
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=!Q@W#E
      - POSTGRES_DB=V2Ray
    restart: always
    ports:
        - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/


  pgadmin:
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=iranv2ray@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=!Q@W#E
    restart: always
    ports:
        - "5050:80"
    volumes:
      - pgadmin_data:/root/.pgadmin

  portainer:
    container_name: portainer
    restart: always
    ports:
      - "8080:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data


  nginx:
    container_name: ngnix
    ports:
       - 80:80
       - 443:443
    build:
       context: ./Nginx
       dockerfile: Nginx.Dockerfile
    restart: always

  v2rayapi:
    expose:
      - "5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionString:Default=Server=posgresdb;Port=5432;Database=V2Ray;User Id=admin;Password=!Q@W#E;
    volumes:
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    restart: always
  
  

  #nginx:
  ## ports:
  ##    - "80:80"



